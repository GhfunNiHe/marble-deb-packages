# Debian's hexagonrpcd is a wrapper script; set its env vars to point at the
# SLPI and the HexagonFS registry from firmware-redmi-marble (not droid-juicer).
[Service]
Environment=hexagonrpcd_device=/dev/fastrpc-sdsp
Environment=hexagonrpcd_dsp=sdsp
Environment=hexagonrpcd_fw_dir=/usr/share/qcom/hexagonfs/
# The daemon exits 0 when its FastRPC session breaks after an SLPI crash;
# systemd would treat that as success, so restart unconditionally.
Restart=always
RestartSec=2
