# marble: the sensors live on the SLPI (SDSP), and their registry is the
# HexagonFS tree that firmware-redmi-marble installs under /usr/share/qcom,
# not the droid-juicer dump Debian defaults to.
#
# Upstream ships this as a drop-in for hexagonrpcd-sdsp.service, the Alpine/
# pmOS per-DSP unit that runs /usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp ...
# Debian's hexagonrpcd (source package hexagonrpc) is a single unit that starts
# the same /usr/bin/hexagonrpcd, but there it is a wrapper script which builds
# that command line from environment variables when it is started without
# arguments (see /usr/share/doc/hexagonrpcd/README.Debian). Setting the
# variables is therefore the Debian-shaped way to get the identical command.
[Service]
Environment=hexagonrpcd_device=/dev/fastrpc-sdsp
Environment=hexagonrpcd_dsp=sdsp
Environment=hexagonrpcd_fw_dir=/usr/share/qcom/hexagonfs/
