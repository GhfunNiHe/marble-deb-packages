# marble: ath11k_pci must not autoload before marble-mac-restore.service has
# placed the factory MAC file (wlan_mac.bin) into the firmware directory;
# the kernel patch ath11k-load-wlan-mac-from-firmware reads it at driver
# registration. The driver is modprobed by that service instead.
blacklist ath11k_pci
blacklist ath11k
