# The stock unit runs /usr/bin/qcom-modem-setup directly, and that script only
# gives the SIM one second (sim_wait_time=1) before it declares the card
# missing. On marble the UIM needs roughly ten seconds, so the script always
# failed on a cold boot: no provisioning session, ModemManager stuck in
# failed/sim-missing, no PIN prompt. Hand the job to the wrapper, which re-runs
# the stock script with a 30 s budget.
[Service]
ExecStart=
ExecStart=/usr/libexec/marble-modem-setup
