# marble: iio-sensor-proxy segfaults when hexagonrpcd disappears underneath it
# (g_task_return_error: assertion '!task->ever_returned' failed, then SIGSEGV,
# seen after the SLPI crashed 84 s into a boot). Debian's unit has no Restart=,
# so the proxy stayed dead even after hexagonrpcd came back. Restart it and it
# re-detects the sensors on its own.
#
# PartOf: restart the proxy whenever hexagonrpcd is restarted, including the
# restart marble-sensors-refresh.service issues after an SLPI recovery. Without
# it the proxy keeps the sessions it opened before the restart and reports
# nothing (or 0 lux) while still looking healthy.
[Unit]
PartOf=hexagonrpcd.service

[Service]
Restart=on-failure
RestartSec=2
