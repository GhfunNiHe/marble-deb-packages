# qbootctl resolves the boot partitions through /dev/disk/by-partlabel/boot_a
# and boot_b, symlinks created by udev. The shipped unit only orders itself
# after local-fs.target, which does not guarantee udev has created those
# symlinks. If qbootctl runs first it fails with "gpt_get_headers: Failed to
# resolve path for boot_a", the slot is never marked successful, and ABL
# drains the retry counter until the device falls back to fastboot.
#
# udev tags these partitions for systemd, so order against the device units
# directly. Both slots are listed because either one may be the current slot.
[Unit]
After=dev-disk-by\x2dpartlabel-boot_a.device dev-disk-by\x2dpartlabel-boot_b.device
Wants=dev-disk-by\x2dpartlabel-boot_a.device dev-disk-by\x2dpartlabel-boot_b.device
