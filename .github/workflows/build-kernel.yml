name: Build Kernel Deb

# Standalone kernel build, manual trigger only: 30-90 min even with a warm ccache.
# Same layout contract as build.yml: vmlinuz + DTB in /boot, no initramfs, ESP synced by postinst.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (untick to publish a full release)'
        type: boolean
        default: true
      # 源码参数：默认值就是本仓库当前构建用的上游地址和 main 分支。
      kernel_src_repo:
        description: 'linux-marble 内核源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/GhfunNiHe/linux-marble'
      kernel_src_ref:
        description: 'linux-marble 的分支/tag/提交'
        type: string
        default: 'marble-7.2'

# Source parameters: repo URL and optional ref, empty ref keeps the default.
env:
  SRC_KERNEL_REPO: ${{ inputs.kernel_src_repo || 'https://github.com/GhfunNiHe/linux-marble' }}
  SRC_KERNEL_REF: ${{ inputs.kernel_src_ref }}   # empty = marble-7.2

# Kernel rebuilds supersede each other; never queue them up.
concurrency:
  group: build-kernel-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel DEB
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container:
      image: debian:trixie
    env:
      # debian/rules would default to 10G, which is GitHub's entire
      # per-repository cache budget: one kernel cache would evict everything.
      CCACHE_MAXSIZE: 4G

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev ccache git ca-certificates wget \
            bc bison flex libssl-dev libelf-dev dwarves \
            rsync cpio kmod python3 zstd xz-utils lz4 \
            clang lld llvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup work dirs
        run: |
          mkdir -p "$RUNNER_TEMP/build" "$GITHUB_WORKSPACE/out"
          # debian/rules uses ${CCACHE_DIR:-$HOME/.ccache}; pin it here so the
          # kernel cache is the directory the cache steps below handle.
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ccache: same pool as build.yml, so a warm kernel is shared.
      #
      # Separate save step: the combined action saves in a post-if success() step, so a failed build would drop the cache.
      #
      # Keys carry github.run_id: a cache entry can never be overwritten.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-marble-${{ runner.os }}-${{ runner.arch }}-
            ccache-marble-

      - name: Download upstream source
        run: |
          # GitLab wants the project name in the path, GitHub and Codeberg do not.
          REF="${SRC_KERNEL_REF:-marble-7.2}"
          case "$SRC_KERNEL_REPO" in
            *gitlab*) URL="$SRC_KERNEL_REPO/-/archive/$REF/$(basename "$SRC_KERNEL_REPO")-$REF.tar.gz" ;;
            *)        URL="$SRC_KERNEL_REPO/archive/$REF.tar.gz" ;;
          esac
          echo "kernel source: $URL"

          wget -c -q -O "$RUNNER_TEMP/build/linux-marble.tar.gz" "$URL"
          # Top-level dir is <repo>-<ref>: find it, then pass it on through $GITHUB_ENV.
          mkdir -p "$RUNNER_TEMP/build/kernel-src"
          tar -xf "$RUNNER_TEMP/build/linux-marble.tar.gz" -C "$RUNNER_TEMP/build/kernel-src"
          KSRC=$(find "$RUNNER_TEMP/build/kernel-src" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$KSRC" ] || { echo "FAIL: kernel tarball has no top-level directory"; exit 1; }
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"

      - name: Overlay debian/ and configs
        run: |
          cp -a linux-xiaomi-marble/debian "$KSRC/debian"
          cp linux-xiaomi-marble/config-xiaomi-marble.aarch64 "$KSRC/"
          cp linux-xiaomi-marble/extra-kernel.config "$KSRC/"

      - name: Build kernel
        run: |
          mkdir -p ~/.ccache
          cd "$KSRC"
          dpkg-buildpackage -b -us -uc
          echo "=== ccache stats ==="
          ccache --show-stats

          KREL=$(cat include/config/kernel.release)
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          # dpkg-buildpackage drops the .deb next to the source tree, i.e. in
          # the wrapper dir, not in $RUNNER_TEMP/build.
          cp "$KSRC"/../*.deb "$GITHUB_WORKSPACE/out/"
          {
            echo "### Kernel build result"
            echo ""
            echo "- kernel release: \`${KREL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Assert on the DEB: two boot files, vmlinuz uncompressed (U-Boot booti).
      - name: Verify kernel DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/linux-xiaomi-marble_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no kernel deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          # [^/][^/]* skips dpkg-deb's bare ./boot/ entry; sh -e (dash), no process substitution.
          BOOT=$(dpkg-deb -c "$DEB" | awk '{print $6}' | grep '^\./boot/[^/][^/]*$' | sort)
          EXPECT=$(printf './boot/sm8475-xiaomi-marble-%s.dtb\n./boot/vmlinuz-%s\n' "$KREL" "$KREL")
          if [ "$BOOT" != "$EXPECT" ]; then
            echo "FAIL: /boot contents are not vmlinuz + DTB only"
            printf 'actual:\n%s\nexpected:\n%s\n' "$BOOT" "$EXPECT"
            exit 1
          fi

          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify"
          if ! file "$RUNNER_TEMP/verify/boot/vmlinuz-$KREL" | grep -q 'ARM64 boot executable Image'; then
            echo "FAIL: vmlinuz is not an uncompressed arm64 Image"; exit 1
          fi
          echo "kernel deb verified: $DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: marble-kernel-deb-${{ env.KREL }}
          path: out/**/*.deb
          retention-days: 90
          if-no-files-found: error

      # Cache this run's output even when the build or verify failed.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

  # Publish the kernel DEB: prerelease when the input is ticked, otherwise a full release.
  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: marble-kernel-deb-*
          merge-multiple: true
          path: debs

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-deb-${{ env.SHORT_SHA }}
          name: Kernel linux-xiaomi-marble (${{ env.SHORT_SHA }})
          files: debs/**/*.deb
          prerelease: ${{ inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
