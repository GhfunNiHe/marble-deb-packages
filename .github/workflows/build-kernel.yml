name: Build Kernel Deb

# Standalone kernel build, manual trigger only. The kernel takes 30-90 min
# even with a warm ccache — far heavier than marble-device-support alone — so
# it gets its own workflow, mirroring sheng_fedora_packages/build-kernel.yml.
#
# Same layout contract as build-marble-debs.yml: vmlinuz (uncompressed Image)
# + DTB in /boot, no initramfs. postinst syncs both to the ESP and fails if
# /boot/efi is not mounted — mounting it is the caller's job (CI loop-mounts
# esp.img before dpkg -i; on the device fstab mounts PARTLABEL=esp there).
# /boot/efi must be a vfat ESP labelled esp. extlinux.conf is written on first
# installation, preserved on upgrades, and an upgrade without one fails before
# the kernel and DTB are replaced.
#
# The kernel source is parameterised the same way as in build-marble-debs.yml:
# see the env block below and the `*_src_*` inputs.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (untick to publish a full release)'
        type: boolean
        default: true
      # 源码参数：默认值就是本仓库当前构建用的上游地址和 main 分支。
      kernel_src_repo:
        description: 'linux-marble 内核源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/iLtanaka/linux-marble'
      kernel_src_ref:
        description: 'linux-marble 的分支/tag/提交'
        type: string
        default: 'main'

# ================================================================
# Source parameters, same contract as build-marble-debs.yml: the repo URL and
# the optional ref can be filled in per run, an empty ref keeps the default.
# ================================================================
env:
  SRC_KERNEL_REPO: ${{ inputs.kernel_src_repo || 'https://github.com/iLtanaka/linux-marble' }}
  SRC_KERNEL_REF: ${{ inputs.kernel_src_ref }}   # empty = main

# Kernel rebuilds supersede each other; never queue them up.
concurrency:
  group: build-kernel-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel DEB
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container:
      image: debian:trixie
    env:
      # debian/rules would default to 10G, which is GitHub's entire
      # per-repository cache budget: one kernel cache would evict everything.
      CCACHE_MAXSIZE: 4G

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev ccache git ca-certificates wget \
            bc bison flex libssl-dev libelf-dev dwarves \
            rsync cpio kmod python3 zstd xz-utils lz4 \
            clang lld llvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup work dirs
        run: |
          mkdir -p "$RUNNER_TEMP/build" "$GITHUB_WORKSPACE/out"
          # debian/rules uses ${CCACHE_DIR:-$HOME/.ccache}; pin it here so the
          # kernel cache is the directory the cache steps below handle.
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      # ================================================================
      # ccache: the same pool as build-marble-debs.yml, so a kernel warmed up
      # by either workflow is reused by the other.
      #
      # Restore and save are separate steps on purpose. The combined
      # actions/cache action hides the save in its post step, which is
      # declared `post-if: success()`, and its `save-always` input is
      # deprecated because it "does not work as intended" — so a failed kernel
      # build (ThinLTO OOM in the link, a verify assertion) would throw away
      # everything it compiled and the next run would start cold again.
      # `if: always()` on the save step is the documented replacement.
      #
      # The primary key carries github.run_id because a cache entry can never
      # be overwritten: with a stable key the first successful run would pin
      # the entry for good and every later run would only ever read that stale
      # copy. The restore keys then pick up the newest entry of any run.
      # ================================================================
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-marble-${{ runner.os }}-${{ runner.arch }}-
            ccache-marble-

      - name: Download upstream source
        run: |
          # GitLab wants the project name inside the path, GitHub and
          # Codeberg/Gitea do not; both forms resolve a branch, a tag or a
          # commit, so the ref parameter can point at any of the three.
          REF="${SRC_KERNEL_REF:-main}"
          case "$SRC_KERNEL_REPO" in
            *gitlab*) URL="$SRC_KERNEL_REPO/-/archive/$REF/$(basename "$SRC_KERNEL_REPO")-$REF.tar.gz" ;;
            *)        URL="$SRC_KERNEL_REPO/archive/$REF.tar.gz" ;;
          esac
          echo "kernel source: $URL"

          wget -c -q -O "$RUNNER_TEMP/build/linux-marble.tar.gz" "$URL"
          # The tarball's top-level directory is <repo>-<ref>, so it changes
          # name with the source parameters; untar into a wrapper dir and find
          # it, then hand the path to the next steps through $GITHUB_ENV.
          mkdir -p "$RUNNER_TEMP/build/kernel-src"
          tar -xf "$RUNNER_TEMP/build/linux-marble.tar.gz" -C "$RUNNER_TEMP/build/kernel-src"
          KSRC=$(find "$RUNNER_TEMP/build/kernel-src" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$KSRC" ] || { echo "FAIL: kernel tarball has no top-level directory"; exit 1; }
          echo "KSRC=$KSRC" >> "$GITHUB_ENV"

      - name: Overlay debian/ and configs
        run: |
          cp -a linux-redmi-marble/debian "$KSRC/debian"
          cp linux-redmi-marble/config-xiaomi-marble.aarch64 "$KSRC/"

      - name: Build kernel
        run: |
          mkdir -p ~/.ccache
          cd "$KSRC"
          dpkg-buildpackage -b -us -uc
          echo "=== ccache stats ==="
          ccache --show-stats

          KREL=$(cat include/config/kernel.release)
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          # dpkg-buildpackage drops the .deb next to the source tree, i.e. in
          # the wrapper dir, not in $RUNNER_TEMP/build.
          cp "$KSRC"/../*.deb "$GITHUB_WORKSPACE/out/"
          {
            echo "### Kernel build result"
            echo ""
            echo "- kernel release: \`${KREL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # /boot must be exactly the two files the boot chain reads, and vmlinuz
      # must be the uncompressed arm64 Image (U-Boot booti cannot load a
      # gzip/zstd image). Assert it on the deliverable, not on the build tree.
      - name: Verify kernel DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/linux-redmi-marble_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no kernel deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          # [^/][^/]* so the bare ./boot/ directory entry dpkg-deb lists does
          # not count as a boot file; steps run under sh -e (dash), so no
          # process substitution anywhere in here.
          BOOT=$(dpkg-deb -c "$DEB" | awk '{print $6}' | grep '^\./boot/[^/][^/]*$' | sort)
          EXPECT=$(printf './boot/sm8475-xiaomi-marble-%s.dtb\n./boot/vmlinuz-%s\n' "$KREL" "$KREL")
          if [ "$BOOT" != "$EXPECT" ]; then
            echo "FAIL: /boot contents are not vmlinuz + DTB only"
            printf 'actual:\n%s\nexpected:\n%s\n' "$BOOT" "$EXPECT"
            exit 1
          fi

          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify"
          if ! file "$RUNNER_TEMP/verify/boot/vmlinuz-$KREL" | grep -q 'ARM64 boot executable Image'; then
            echo "FAIL: vmlinuz is not an uncompressed arm64 Image"; exit 1
          fi
          echo "kernel deb verified: $DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: marble-kernel-deb-${{ env.KREL }}
          path: out/**/*.deb
          retention-days: 90
          if-no-files-found: error

      # Keep the compiled objects cached even when the build or the verify
      # assertion above failed (see the note on the restore step). The key is
      # this run's, so this only ever adds an entry; if it already exists the
      # action warns and skips instead of failing.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

  # ==================================================================
  # Publish the kernel DEB as a GitHub release: a prerelease when the
  # `prerelease` input is ticked (the default), a full release otherwise.
  # Re-running with a different choice updates the existing kernel-deb-<sha>
  # release in place, which doubles as the prerelease -> release promotion.
  # ==================================================================
  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: marble-kernel-deb-*
          merge-multiple: true
          path: debs

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: kernel-deb-${{ env.SHORT_SHA }}
          name: Kernel linux-redmi-marble (${{ env.SHORT_SHA }})
          files: debs/**/*.deb
          prerelease: ${{ inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
