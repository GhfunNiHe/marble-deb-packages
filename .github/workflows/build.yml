name: Build Marble Deb Packages

# Everything in this repo is built here — there is deliberately no build
# script. Each package directory is self-contained (`<pkg>/debian/` plus its
# config/auxiliary files) and is overlaid onto a fresh upstream checkout
# inside the workflow, mirroring sheng_fedora_packages.
#
# The kernel is the heavy one (ThinLTO + 1356 modules, 30-90 min even with a
# warm ccache), so it gets its own manual-only workflow too:
# build-kernel-deb.yml. Note that /boot ships only what the boot chain reads
# (vmlinuz + DTB) and no initramfs is generated: this is the original port's
# verified no-initramfs direct-boot route.

on:
  push:
    branches:
      - main
    paths:
      - 'linux-redmi-marble/**'
      - 'marble-device-support/**'
      - 'firmware-redmi-marble/**'
      - 'libssc/**'
      - 'libqmi/**'
      - 'modemmanager/**'
      - 'iio-sensor-proxy-ssc/**'
      - 'libva-v4l2/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Rebuilds supersede each other; never queue them up.
concurrency:
  group: build-marble-debs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DEBs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container:
      image: debian:trixie

    steps:
      # Build-Depends are enforced for every package below (no -d anywhere), so
      # this list is the union of all the debian/control files, minus what the
      # workflow itself builds and installs. The notables: bash-completion
      # (libqmi's meson hard-requires bash-completion.pc), dbus/polkitd/
      # python3-dbus/python3-gi (ModemManager), python3-dev (libssc's meson
      # mocking/ subdir hard-requires the Python headers).
      # libqmi-glib-dev is deliberately NOT here: the libqmi step below builds
      # 1.39.1 and installs it before anything needs it, and trixie's 1.36.0
      # would drag in libqmi-proxy, which is version-locked to libqmi-glib5
      # (= 1.36.0-1) and breaks the next apt run once the upgrade lands.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev ccache git ca-certificates wget \
            bc bison flex libssl-dev libelf-dev dwarves \
            rsync cpio kmod python3 zstd xz-utils lz4 \
            clang lld llvm \
            meson ninja-build pkg-config \
            libglib2.0-dev libprotobuf-c-dev \
            protobuf-compiler protobuf-c-compiler \
            libgudev-1.0-dev libpolkit-gobject-1-dev \
            libmbim-glib-dev libqrtr-glib-dev libsystemd-dev libgirepository1.0-dev \
            gtk-doc-tools gi-docgen help2man valac xsltproc systemd-dev \
            bash-completion gettext libdbus-1-dev dbus polkitd \
            python3-dbus python3-dev python3-gi libglib2.0-doc \
            libva-dev libdrm-dev libegl-dev libgles-dev libgbm-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup work dirs
        run: mkdir -p "$RUNNER_TEMP/build" "$GITHUB_WORKSPACE/out"

      # ================================================================
      # firmware: overlay debian/ onto the upstream *tag* snapshot. The tag
      # comes from debian/changelog so there is a single version source.
      # Upstream owns the blobs; debian/rules owns the install layout and
      # the wcn-prefixed Bluetooth links btqca asks for on WCN6855.
      # ================================================================
      - name: "Build: firmware-redmi-marble"
        run: |
          FWVER=$(dpkg-parsechangelog -l firmware-redmi-marble/debian/changelog -SVersion | cut -d- -f1)
          echo "FWVER=$FWVER" >> "$GITHUB_ENV"
          wget -c -q -O "$RUNNER_TEMP/build/firmware.tar.gz" \
            "https://github.com/iLtanaka/firmware-xiaomi-marble/archive/refs/tags/v${FWVER}/firmware-xiaomi-marble-${FWVER}.tar.gz"
          mkdir -p "$RUNNER_TEMP/build/fw"
          tar -xf "$RUNNER_TEMP/build/firmware.tar.gz" -C "$RUNNER_TEMP/build/fw"
          SRC=$(find "$RUNNER_TEMP/build/fw" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$SRC" ] || { echo "FAIL: firmware tarball has no top-level directory"; exit 1; }

          cp -a firmware-redmi-marble/debian "$SRC/debian"
          cd "$SRC"
          dpkg-buildpackage -b -us -uc
          # dpkg-buildpackage drops the .deb one level up from $SRC, i.e. in
          # $RUNNER_TEMP/build/fw/ — NOT $RUNNER_TEMP/build/ — because we untar
          # the firmware tarball into that wrapper dir. Copy from there, or the
          # firmware deb never reaches out/ and Verify firmware DEB fails.
          cp "$SRC"/../*.deb "$GITHUB_WORKSPACE/out/"

      # ================================================================
      # libqmi: git master, pinned. The QMI_LOC engine on this modem is
      # AFW-gated: GPS only starts when the client identifies itself with
      # the client-identification TLVs (clientStrId 0x10 / clientType 0x11 /
      # enablePosRequestNotification 0x12) that went upstream via MR !470
      # and are absent from the 1.38.0 that Debian trixie ships. ModemManager
      # (built right after) needs libqmi-glib >= 1.37.95 plus those TLVs.
      # The built libqmi-proxy goes into the container with the rest: the gir
      # package depends on it, and keeping the whole set at 1.39.1 leaves no
      # archive libqmi-proxy behind to version-lock libqmi-glib5 to 1.36.0.
      # ================================================================
      - name: "Build: libqmi"
        run: |
          LIBQMI_COMMIT=$(cat libqmi/COMMIT)
          wget -c -q -O "$RUNNER_TEMP/build/libqmi.tar.gz" \
            "https://gitlab.freedesktop.org/mobile-broadband/libqmi/-/archive/${LIBQMI_COMMIT}/libqmi-${LIBQMI_COMMIT}.tar.gz"
          mkdir -p "$RUNNER_TEMP/build/libqmi"
          tar -xf "$RUNNER_TEMP/build/libqmi.tar.gz" -C "$RUNNER_TEMP/build/libqmi" --strip-components=1
          cp -a libqmi/debian "$RUNNER_TEMP/build/libqmi/debian"
          cd "$RUNNER_TEMP/build/libqmi"
          dpkg-buildpackage -b -us -uc
          dpkg -i "$RUNNER_TEMP/build"/libqmi-glib5_*.deb "$RUNNER_TEMP/build"/libqmi-glib-dev_*.deb \
                  "$RUNNER_TEMP/build"/gir1.2-qmi-1.0_*.deb "$RUNNER_TEMP/build"/libqmi-proxy_*.deb
          cp "$RUNNER_TEMP/build"/libqmi-*.deb "$RUNNER_TEMP/build"/gir1.2-qmi-*.deb "$GITHUB_WORKSPACE/out/" || true

      # ================================================================
      # marble-device-support: overlay debian/ onto the upstream checkout.
      # Runs after libqmi on purpose: marble-imsctl (the IMS / SMS-over-IMS
      # enablement tool the package builds from debian/marble-imsctl.c) needs
      # qmi-glib >= 1.38 for the IMSA bind and the IMSS "services enabled"
      # message, and only the 1.39.1 dev package installed above provides it.
      # ================================================================
      - name: "Build: marble-device-support"
        run: |
          git clone --depth 1 https://github.com/iLtanaka/marble-device-support.git \
            "$RUNNER_TEMP/build/marble-device-support"
          cp -a marble-device-support/debian "$RUNNER_TEMP/build/marble-device-support/debian"
          cd "$RUNNER_TEMP/build/marble-device-support"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # ================================================================
      # modemmanager: git master, pinned to the commit the AFW-unlock and
      # Position-Report patches were authored against. Stock Debian MM
      # (1.24.2) fails '--location-enable-gps-nmea' with QMI error 46 on
      # this modem: the GNSS engine refuses non-framework clients. Tests
      # are skipped (dev snapshot, one flaky test) via DEB_BUILD_OPTIONS.
      # ================================================================
      - name: "Build: modemmanager"
        run: |
          MM_COMMIT=$(cat modemmanager/COMMIT)
          wget -c -q -O "$RUNNER_TEMP/build/mm.tar.gz" \
            "https://gitlab.freedesktop.org/mobile-broadband/ModemManager/-/archive/${MM_COMMIT}/ModemManager-${MM_COMMIT}.tar.gz"
          mkdir -p "$RUNNER_TEMP/build/mm"
          tar -xf "$RUNNER_TEMP/build/mm.tar.gz" -C "$RUNNER_TEMP/build/mm" --strip-components=1
          cd "$RUNNER_TEMP/build/mm"
          # debian/source/format is 3.0 (quilt), so the patches in
          # debian/patches/{,series} below are applied by
          # 'dpkg-source --before-build' inside dpkg-buildpackage - no manual
          # 'patch -p1' here.
          cp -a "$GITHUB_WORKSPACE/modemmanager/debian" debian
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/modemmanager_*.deb "$RUNNER_TEMP/build"/libmm-glib0_*.deb \
             "$RUNNER_TEMP/build"/libmm-glib-dev_*.deb "$RUNNER_TEMP/build"/gir1.2-modemmanager-*.deb \
             "$GITHUB_WORKSPACE/out/"

      # ================================================================
      # libssc: overlay debian/ onto the upstream codeberg *tag* snapshot. The
      # tag comes from debian/changelog so there is a single version source.
      # Debian and Ubuntu do not package libssc, which is the only reason
      # their iio-sensor-proxy cannot have Qualcomm SSC support.
      # ================================================================
      - name: "Build: libssc"
        run: |
          LSVER=$(dpkg-parsechangelog -l libssc/debian/changelog -SVersion | cut -d- -f1)
          echo "LSVER=$LSVER" >> "$GITHUB_ENV"
          wget -c -q -O "$RUNNER_TEMP/build/libssc.tar.gz" \
            "https://codeberg.org/DylanVanAssche/libssc/archive/v${LSVER}.tar.gz"
          mkdir -p "$RUNNER_TEMP/build/libssc"
          tar -xf "$RUNNER_TEMP/build/libssc.tar.gz" -C "$RUNNER_TEMP/build/libssc" --strip-components=1

          cp -a libssc/debian "$RUNNER_TEMP/build/libssc/debian"
          cd "$RUNNER_TEMP/build/libssc"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # iio-sensor-proxy needs libssc's headers and pkg-config file, so the
      # package that was just built is installed into the container before
      # this step (this is also what satisfies its Build-Depends).
      - name: "Install libssc (build dependency of iio-sensor-proxy-ssc)"
        run: |
          apt-get install -y "$GITHUB_WORKSPACE"/out/libssc_*.deb
          pkg-config --modversion libssc

      # ================================================================
      # iio-sensor-proxy-ssc: stock upstream 3.9, built with SSC support on.
      # Named -ssc and declared as a replacement for iio-sensor-proxy, because
      # the archive build has no libssc to link against.
      # ================================================================
      - name: "Build: iio-sensor-proxy-ssc"
        run: |
          IIOVER=$(dpkg-parsechangelog -l iio-sensor-proxy-ssc/debian/changelog -SVersion | cut -d- -f1)
          echo "IIOVER=$IIOVER" >> "$GITHUB_ENV"
          wget -c -q -O "$RUNNER_TEMP/build/iio.tar.gz" \
            "https://gitlab.freedesktop.org/hadess/iio-sensor-proxy/-/archive/${IIOVER}/iio-sensor-proxy-${IIOVER}.tar.gz"
          mkdir -p "$RUNNER_TEMP/build/iio"
          tar -xf "$RUNNER_TEMP/build/iio.tar.gz" -C "$RUNNER_TEMP/build/iio" --strip-components=1

          cp -a iio-sensor-proxy-ssc/debian "$RUNNER_TEMP/build/iio/debian"
          cd "$RUNNER_TEMP/build/iio"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # ================================================================
      # libva-v4l2: the VA-API backend for the Iris stateful V4L2 M2M
      # decoder. Debian only ships Intel and Mesa VA drivers, so browsers
      # and every VA-API consumer have no way to reach the Qualcomm driver
      # without this package. Pinned to the radxa fork: upstream
      # mxsrc/libva-v4l2 is stateless-only, while Iris is stateful.
      #
      # It pairs with the iris decode-order patch in
      # linux-redmi-marble/debian/patches (the backend refuses to start
      # without those controls: "S_CTRL DISPLAY_DELAY ... Invalid
      # argument"), and installs v4l2_drv_video.so plus the
      # msm_drv_video.so alias libva probes for Qualcomm parts, so plain
      # vaInitialize() finds it with no environment variables.
      # ================================================================
      - name: "Build: libva-v4l2"
        run: |
          VACOMMIT=$(cat libva-v4l2/COMMIT)
          wget -c -q -O "$RUNNER_TEMP/build/libva-v4l2.tar.gz" \
            "https://github.com/radxa-pkg/libva-v4l2/archive/${VACOMMIT}/libva-v4l2-${VACOMMIT}.tar.gz"
          mkdir -p "$RUNNER_TEMP/build/libva-v4l2"
          tar -xf "$RUNNER_TEMP/build/libva-v4l2.tar.gz" -C "$RUNNER_TEMP/build/libva-v4l2" --strip-components=1
          cp -a "$GITHUB_WORKSPACE/libva-v4l2/debian" "$RUNNER_TEMP/build/libva-v4l2/debian"
          cd "$RUNNER_TEMP/build/libva-v4l2"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/libva-v4l2_*.deb "$GITHUB_WORKSPACE/out/"

      # ================================================================
      # Kernel: overlay debian/ + configs onto the upstream main snapshot
      # ================================================================
      # save-always keeps the cache warm across failed runs: a kernel build
      # that dies (OOM during the ThinLTO link, a verify-time assertion) still
      # leaves its ccache populated, so the next run starts from that cache
      # instead of a cold one and does not recompile everything it already did.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-linux-redmi-marble-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('linux-redmi-marble/debian/rules', 'linux-redmi-marble/config-xiaomi-marble.aarch64') }}
          restore-keys: |
            ccache-linux-redmi-marble-${{ runner.os }}-${{ runner.arch }}-
            ccache-linux-redmi-marble-
          save-always: true

      - name: "Build: linux-redmi-marble"
        run: |
          mkdir -p ~/.ccache
          wget -c -q -O "$RUNNER_TEMP/build/linux-marble.tar.gz" \
            "https://github.com/iLtanaka/linux-marble/archive/refs/heads/main/linux-marble.tar.gz"
          tar -xf "$RUNNER_TEMP/build/linux-marble.tar.gz" -C "$RUNNER_TEMP/build"
          SRC="$RUNNER_TEMP/build/linux-marble-main"
          cp -a linux-redmi-marble/debian "$SRC/debian"
          cp linux-redmi-marble/config-xiaomi-marble.aarch64 "$SRC/"

          cd "$SRC"
          # debian/source/format is 3.0 (native), so dpkg-source ignores
          # debian/patches (unlike the ModemManager step, which is 3.0
          # (quilt) and lets dpkg-source apply debian/patches/series).
          # debian/rules applies the series in its configure target instead,
          # so CI and a local dpkg-buildpackage run behave identically.
          # The patches are a pair with userspace: ath11k WLAN MAC with
          # marble-mac-restore.service (otherwise a random MAC every boot),
          # iris decode-order output with the libva-v4l2 backend built above.
          dpkg-buildpackage -b -us -uc
          echo "=== ccache stats ==="
          ccache --show-stats

          KREL=$(cat include/config/kernel.release)
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"
          {
            echo "### Kernel build result"
            echo ""
            echo "- kernel release: \`${KREL}\`"
            echo "- modules: $(find "$GITHUB_WORKSPACE/out" -name '*.deb' -exec dpkg-deb -c {} \; | grep -c 'ko\.zst')"
          } >> "$GITHUB_STEP_SUMMARY"

      # ================================================================
      # Verify the DEB rather than trusting "the build succeeded"
      # ================================================================
      # /boot must contain exactly the two files the boot chain reads, and
      # vmlinuz must be the uncompressed arm64 Image (U-Boot booti cannot
      # load a gzip/zstd image). Catches regressions in debian/rules.
      - name: Verify kernel DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/linux-redmi-marble_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no kernel deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          # [^/][^/]* so the bare ./boot/ directory entry dpkg-deb lists
          # does not count as a boot file; steps run under sh -e (dash), so
          # no process substitution anywhere in here.
          BOOT=$(dpkg-deb -c "$DEB" | awk '{print $6}' | grep '^\./boot/[^/][^/]*$' | sort)
          EXPECT=$(printf './boot/sm8475-xiaomi-marble-%s.dtb\n./boot/vmlinuz-%s\n' "$KREL" "$KREL")
          if [ "$BOOT" != "$EXPECT" ]; then
            echo "FAIL: /boot contents are not vmlinuz + DTB only"
            printf 'actual:\n%s\nexpected:\n%s\n' "$BOOT" "$EXPECT"
            exit 1
          fi

          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify"
          if ! file "$RUNNER_TEMP/verify/boot/vmlinuz-$KREL" | grep -q 'ARM64 boot executable Image'; then
            echo "FAIL: vmlinuz is not an uncompressed arm64 Image"; exit 1
          fi
          # ath11k is a module, so the WLAN MAC patch can only be checked in
          # the built module. Assert on the firmware file name the patch
          # introduces: an unpatched kernel still builds and boots, it just
          # comes up with a random MAC.
          MOD=$(find "$RUNNER_TEMP/verify" -name 'ath11k.ko.zst' | head -1)
          [ -n "$MOD" ] || { echo "FAIL: ath11k.ko.zst not found in the kernel deb"; exit 1; }
          zstdcat "$MOD" | strings | grep -q 'wlan_mac.bin' \
            || { echo "FAIL: ath11k WLAN MAC patch is not in the built module"; exit 1; }

          # Same reasoning for the iris decode-order patch: an unpatched
          # kernel builds and boots, it just cannot feed VA-API clients. The
          # handler the patch adds is a static function, so it is present in
          # the module's kallsyms table but not as an exported symbol.
          IRIS=$(find "$RUNNER_TEMP/verify" -name 'qcom-iris.ko.zst' | head -1)
          [ -n "$IRIS" ] || { echo "FAIL: qcom-iris.ko.zst not found in the kernel deb"; exit 1; }
          zstdcat "$IRIS" | strings | grep -q 'iris_hfi_gen2_set_decode_order_output' \
            || { echo "FAIL: iris decode-order patch is not in the built module"; exit 1; }
          echo "kernel deb verified: $DEB"

      # Same reasoning as the kernel: assert on the deliverable. The
      # Bluetooth link is the one that has already shipped wrong once
      # (qca/wcnbtfw21.tlv, with the "hp" stripped), which makes btqca fail
      # with -ENOENT on WCN6855 while the blobs look present on disk.
      - name: Verify firmware DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/firmware-redmi-marble_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no firmware deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Recommends

          LIST=$(dpkg-deb -c "$DEB")
          for f in \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/a730_zap.mbn \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/adsp2.b00 \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/modem.mdt \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/slpi2.b00 \
            ./usr/lib/firmware/qcom/a730_sqe.fw \
            ./usr/lib/firmware/qcom/gmu_gen70000.bin \
            ./usr/lib/firmware/qcom/sm8450/SM8475-Xiaomi-Marble-tplg.bin \
            ./usr/lib/firmware/qca/hpbtfw21.tlv \
            ./usr/lib/firmware/ath11k/WCN6855/hw2.0/board.bin \
            ./usr/share/qcom/hexagonfs/sns_reg_version ; do
            echo "$LIST" | grep -q " $f\$" || { echo "FAIL: firmware deb is missing $f"; exit 1; }
          done

          echo "$LIST" | grep -qE 'qca/wcnhpbtfw21\.tlv -> hpbtfw21\.tlv$' \
            || { echo "FAIL: qca/wcnhpbtfw21.tlv link missing or points at the wrong name"; exit 1; }
          echo "$LIST" | grep -qE 'qca/wcnhpnv21\.301 -> hpnv21\.301$' \
            || { echo "FAIL: qca/wcnhpnv21.301 link missing or points at the wrong name"; exit 1; }

          echo "wcn-prefixed links: $(echo "$LIST" | grep -c 'wcnh')"
          echo "firmware deb verified: $DEB"

      # libssc is a build dependency of iio-sensor-proxy-ssc, so its contents
      # matter as much as its runtime behaviour: the headers and the pkg-config
      # file are the interface the other package compiles against.
      - name: Verify libssc DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/libssc_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no libssc deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          LIST=$(dpkg-deb -c "$DEB")
          for pat in 'libssc\.so\.2' '/ssccli$' 'pkgconfig/libssc\.pc$' 'include/libssc/libssc-sensor\.h$'; do
            echo "$LIST" | grep -qE "$pat" || { echo "FAIL: libssc deb is missing $pat"; exit 1; }
          done

          rm -rf "$RUNNER_TEMP/verify-libssc"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify-libssc"
          SO=$(find "$RUNNER_TEMP/verify-libssc" -name 'libssc.so.2*' -type f | head -1)
          [ -n "$SO" ] || { echo "FAIL: no libssc.so.2 in the package"; exit 1; }
          echo "shared library: $SO"
          # A quilt patch that stops applying does not fail the build, it just
          # quietly ships the unpatched library. Assert on the string the patch
          # adds instead of trusting "the build succeeded".
          strings "$SO" | grep -q 'not found yet, retrying' \
            || { echo "FAIL: wait-for-qmi-service.patch is not in the built library"; exit 1; }
          echo "libssc deb verified: $DEB"

      # The one assertion that distinguishes this package from Debian's own
      # iio-sensor-proxy: if -Dssc-support ever falls back to disabled, the
      # binary no longer links libssc and dpkg-shlibdeps drops it from Depends.
      - name: Verify iio-sensor-proxy-ssc DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/iio-sensor-proxy-ssc_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no iio-sensor-proxy-ssc deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends Provides Conflicts Replaces

          dpkg-deb -f "$DEB" Depends | grep -q 'libssc' \
            || { echo "FAIL: no Depends on libssc -> SSC support is off"; exit 1; }
          dpkg-deb -f "$DEB" Provides | grep -q 'iio-sensor-proxy' \
            || { echo "FAIL: missing Provides: iio-sensor-proxy"; exit 1; }

          LIST=$(dpkg-deb -c "$DEB")
          # Path prefixes are matched loosely: dh may answer with /usr/lib or
          # /lib depending on the merge state of the container. What must not
          # change is the file names, because marble-device-support drops in on
          # iio-sensor-proxy.service and the rootfs enables that exact unit.
          for pat in '/usr/libexec/iio-sensor-proxy$' '/monitor-sensor$' \
                     '/systemd/system/iio-sensor-proxy\.service$' \
                     '/udev/rules\.d/80-iio-sensor-proxy\.rules$' \
                     '/dbus-1/system\.d/net\.hadess\.SensorProxy\.conf$' \
                     '/polkit-1/actions/net\.hadess\.SensorProxy\.policy$'; do
            echo "$LIST" | grep -qE "$pat" || { echo "FAIL: missing $pat"; exit 1; }
          done
          echo "iio-sensor-proxy-ssc deb verified: $DEB"

      # What matters is that libva can find the driver: the .so has to sit in
      # the multiarch dri directory and the msm alias has to point at it, or
      # vaInitialize() silently probes nothing and every VA-API application
      # falls back to software without saying so.
      - name: Verify libva-v4l2 DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/libva-v4l2_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no libva-v4l2 deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends Provides

          dpkg-deb -f "$DEB" Provides | grep -q 'va-driver' \
            || { echo "FAIL: missing Provides: va-driver"; exit 1; }
          dpkg-deb -f "$DEB" Depends | grep -q 'libdrm' \
            || { echo "FAIL: no libdrm dependency -> the driver links nothing"; exit 1; }

          LIST=$(dpkg-deb -c "$DEB")
          echo "$LIST" | grep -qE 'dri/v4l2_drv_video\.so$' \
            || { echo "FAIL: v4l2_drv_video.so is not installed under .../dri"; exit 1; }
          echo "$LIST" | grep -qE 'dri/msm_drv_video\.so -> v4l2_drv_video\.so$' \
            || { echo "FAIL: the msm_drv_video.so alias is missing or points elsewhere"; exit 1; }
          echo "$LIST" | grep -qE 'environment\.d/60-libva-v4l2\.conf$' \
            || { echo "FAIL: GStreamer VA environment config is missing"; exit 1; }
          echo "libva-v4l2 deb verified: $DEB"

      - name: Upload DEBs
        uses: actions/upload-artifact@v7
        with:
          name: marble-debs
          path: out/**/*.deb
          retention-days: 14
          if-no-files-found: error

  # ==================================================================
  # GitHub Release
  # ==================================================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Download DEBs
        uses: actions/download-artifact@v8
        with:
          name: marble-debs
          path: debs

      # dbgsym packages are kept in the build artifact (GitHub Actions) for
      # debugging, but must not land in the release: they are huge and not
      # useful to end users. Stage only the non-dbgsym debs for the release.
      - name: Stage release DEBs (drop dbgsym)
        run: |
          rm -rf release-debs && mkdir -p release-debs
          find debs -name '*.deb' ! -name '*-dbgsym*.deb' -exec cp -t release-debs {} +

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: marble-deb-${{ env.SHORT_SHA }}
          name: Marble Deb Packages (${{ env.SHORT_SHA }})
          files: release-debs/**/*.deb
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
