name: Build Marble Deb Packages

# Each package dir is overlaid onto the selected upstream source.

# Source parameters: overridable per run via workflow_dispatch. Empty refs
# fall back to the changelog version or <pkg>/COMMIT; keep them in sync.
env:
  SRC_FIRMWARE_REPO: ${{ inputs.firmware_src_repo || 'https://github.com/iLtanaka/firmware-xiaomi-marble' }}
  SRC_FIRMWARE_REF: ${{ inputs.firmware_src_ref }}          # empty = v<changelog version>
  SRC_LIBQMI_REPO: ${{ inputs.libqmi_src_repo || 'https://gitlab.freedesktop.org/mobile-broadband/libqmi' }}
  SRC_LIBQMI_REF: ${{ inputs.libqmi_src_ref }}              # empty = libqmi/COMMIT
  SRC_DEVSUPPORT_REPO: ${{ inputs.devsupport_src_repo || 'https://github.com/GhfunNiHe/marble-device-support' }}
  SRC_DEVSUPPORT_REF: ${{ inputs.devsupport_src_ref || 'main' }}
  SRC_MODEMMANAGER_REPO: ${{ inputs.modemmanager_src_repo || 'https://gitlab.freedesktop.org/mobile-broadband/ModemManager' }}
  SRC_MODEMMANAGER_REF: ${{ inputs.modemmanager_src_ref }}  # empty = modemmanager/COMMIT
  SRC_CALLAUDIOD_POOL: https://deb.debian.org/debian/pool/main/c/callaudiod
  SRC_LIBSSC_REPO: ${{ inputs.libssc_src_repo || 'https://codeberg.org/DylanVanAssche/libssc' }}
  SRC_LIBSSC_REF: ${{ inputs.libssc_src_ref }}              # empty = v<changelog version>
  SRC_IIO_REPO: ${{ inputs.iio_src_repo || 'https://gitlab.freedesktop.org/hadess/iio-sensor-proxy' }}
  SRC_IIO_REF: ${{ inputs.iio_src_ref }}                    # empty = <changelog version>
  SRC_HEXAGONRPC_REPO: ${{ inputs.hexagonrpc_src_repo || 'https://github.com/linux-msm/hexagonrpc' }}
  SRC_HEXAGONRPC_REF: ${{ inputs.hexagonrpc_src_ref || 'v0.4.0' }} # Sensor registry support
  SRC_LIBVA_REPO: ${{ inputs.libva_src_repo || 'https://github.com/FFT-infra/qualcomm-iris-vaapi' }}
  SRC_LIBVA_REF: ${{ inputs.libva_src_ref || 'main' }}  # empty = main

on:
  push:
    branches:
      - main
    paths:
      - 'network-manager/**'
      - 'marble-device-support/**'
      - 'firmware-xiaomi-marble/**'
      - 'libssc/**'
      - 'libqmi/**'
      - 'modemmanager/**'
      - 'callaudiod/**'
      - 'iio-sensor-proxy-ssc/**'
      - 'hexagonrpc/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      # 版本号与 debian/changelog、<pkg>/COMMIT 手动保持一致（default 不支持表达式）。
      firmware_src_repo:
        description: 'firmware-xiaomi-marble 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/iLtanaka/firmware-xiaomi-marble'
      firmware_src_ref:
        description: 'firmware-xiaomi-marble 的 tag/分支/提交（留空 = v<debian/changelog 版本>）'
        type: string
        default: ''
      libqmi_src_repo:
        description: 'libqmi 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/mobile-broadband/libqmi'
      libqmi_src_ref:
        description: 'libqmi 的 tag/分支/提交（留空 = libqmi/COMMIT）'
        type: string
        default: ''
      devsupport_src_repo:
        description: 'marble-device-support 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/GhfunNiHe/marble-device-support'
      devsupport_src_ref:
        description: 'marble-device-support 的分支/tag'
        type: string
        default: 'main'
      modemmanager_src_repo:
        description: 'ModemManager 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/mobile-broadband/ModemManager'
      modemmanager_src_ref:
        description: 'ModemManager 的 tag/分支/提交（留空 = modemmanager/COMMIT）'
        type: string
        default: ''
      networkmanager_src_repo:
        description: 'NetworkManager 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/NetworkManager/NetworkManager'
      networkmanager_src_ref:
        description: 'NetworkManager 的 tag/分支/提交（留空使用 changelog 中的上游版本）'
        type: string
        default: ''
      libssc_src_repo:
        description: 'libssc 源码仓库地址 (repo URL)'
        type: string
        default: 'https://codeberg.org/DylanVanAssche/libssc'
      libssc_src_ref:
        description: 'libssc 的 tag/分支/提交（留空 = v<debian/changelog 版本>）'
        type: string
        default: ''
      iio_src_repo:
        description: 'iio-sensor-proxy 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/hadess/iio-sensor-proxy'
      iio_src_ref:
        description: 'iio-sensor-proxy 的 tag/分支/提交（留空 = <debian/changelog 版本>）'
        type: string
        default: ''
      hexagonrpc_src_repo:
        description: 'hexagonrpc 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/linux-msm/hexagonrpc'
      hexagonrpc_src_ref:
        description: 'hexagonrpc 的 tag/分支/提交（Noble 回移植默认 v0.4.0）'
        type: string
        default: 'v0.4.0'
      libva_src_repo:
        description: 'libva-v4l2 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/FFT-infra/qualcomm-iris-vaapi'
      libva_src_ref:
        description: 'libva-v4l2 的 tag/分支/提交'
        type: string
        default: 'main'

# Rebuilds supersede each other; never queue them up.
concurrency:
  group: build-marble-debs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DEBs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container:
      image: ubuntu:24.04
    env:
      DEB_BUILD_OPTIONS: nocheck
      # Shared ccache pool for the user-space packages.
      CCACHE_MAXSIZE: 4G

    steps:
      # Union of the packages' Build-Depends; libqmi-glib-dev and meson come from the next step.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev ccache git ca-certificates wget \
            rsync cpio kmod python3 zstd xz-utils lz4 alsa-utils \
            ninja-build pkg-config file patch \
            libglib2.0-dev libprotobuf-c-dev libgstreamer-plugins-base1.0-dev \
            protobuf-compiler protobuf-c-compiler \
            libgudev-1.0-dev libpolkit-gobject-1-dev \
            libappstream-dev libasound2-dev libpulse-dev \
            libqrtr-glib-dev libsystemd-dev libgirepository1.0-dev \
            gtk-doc-tools gi-docgen help2man valac xsltproc systemd-dev \
            bash-completion gettext libdbus-1-dev dbus polkitd \
            python3-dbus python3-dev python3-gi libglib2.0-doc \
            libva-dev libdrm-dev libegl-dev libgles-dev libgbm-dev \
            libvulkan-dev ffmpeg

      # Noble's archive is below ModemManager's 1.32 floor. Take the
      # unmodified libmbim build from the dedicated release; keep it in
      # $RUNNER_TEMP so those debs never enter the device release.
      - name: Install libmbim from ubuntu-noble
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/noble-deps"
          python3 - <<'PY' > "$RUNNER_TEMP/noble-deps/urls"
          import json
          import os
          import urllib.request

          api = "https://api.github.com/repos/GhfunNiHe/marble-deb-packages/releases/tags/ubuntu-noble"
          headers = {}
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"
          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request) as response:
              assets = json.load(response)["assets"]
          for asset in assets:
              name = asset["name"]
              if not name.endswith("_arm64.deb") or "-dbgsym" in name:
                  continue
              if not (name.startswith("libmbim-") or name.startswith("gir1.2-mbim-")):
                  continue
              print(asset["browser_download_url"])
          PY
          while IFS= read -r url; do
            wget -q -c --tries=5 --timeout=30 -P "$RUNNER_TEMP/noble-deps" "$url"
          done < "$RUNNER_TEMP/noble-deps/urls"
          apt-get install -y "$RUNNER_TEMP"/noble-deps/*.deb
          dpkg-query -W -f='${Package} ${Version}\n' libmbim-glib4 libmbim-glib-dev

      # noble has meson 1.3.2, libssc needs >= 1.4.0: build 1.4.2 as a dpkg-registered package.
      - name: Bootstrap meson 1.4.2 (noble has 1.3.2)
        run: |
          if command -v meson >/dev/null 2>&1 \
             && dpkg --compare-versions "$(meson --version)" ge 1.4.0; then
            echo "meson $(meson --version) already satisfies libssc"
            exit 0
          fi

          MESON_VERSION=1.4.2
          rm -rf /tmp/meson-build /tmp/meson-pkg
          mkdir -p /tmp/meson-build /tmp/meson-pkg/DEBIAN \
                   /tmp/meson-pkg/usr/bin \
                   /tmp/meson-pkg/usr/lib/python3/dist-packages
          wget -q -O /tmp/meson.tar.gz \
            "https://github.com/mesonbuild/meson/archive/refs/tags/${MESON_VERSION}.tar.gz"
          tar -xf /tmp/meson.tar.gz -C /tmp/meson-build --strip-components=1

          install -m 755 /tmp/meson-build/meson.py /tmp/meson-pkg/usr/bin/meson
          cp -a /tmp/meson-build/mesonbuild \
            /tmp/meson-pkg/usr/lib/python3/dist-packages/
          printf '%s\n' \
            'Package: meson' \
            'Version: 1.4.2-0marble1' \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: all' \
            'Depends: python3, ninja-build' \
            'Maintainer: GhfunNiHe <131235947+GhfunNiHe@users.noreply.github.com>' \
            'Description: high productivity build system (Ubuntu 24.04 backport)' \
            > /tmp/meson-pkg/DEBIAN/control
          dpkg-deb --build /tmp/meson-pkg /tmp/meson_1.4.2-0marble1_all.deb
          dpkg -i /tmp/meson_1.4.2-0marble1_all.deb

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup work dirs
        run: |
          mkdir -p "$RUNNER_TEMP/build" "$GITHUB_WORKSPACE/out"
          # One ccache dir for the whole job, the same default debian/rules uses.
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          # meson no longer auto-detects ccache; Debian's /usr/lib/ccache shim
          # wraps whatever compiler each package invokes.
          if [ -d /usr/lib/ccache ]; then
            echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
            ls /usr/lib/ccache
          else
            echo "::warning::/usr/lib/ccache is missing; the meson packages will compile uncached"
          fi

      # Separate always-on save: save-always is deprecated, keys carry run_id.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-marble-${{ runner.os }}-${{ runner.arch }}-
            ccache-marble-

      # One SRC_<PKG>_URL per package; build steps below never spell a URL out.
      - name: Resolve source URLs
        run: |
          # GitLab needs the project name in the path; others do not.
          src_url() {   # $1 = repo URL, $2 = ref
            case "$1" in
              *gitlab*) printf '%s/-/archive/%s/%s-%s.tar.gz\n' "$1" "$2" "$(basename "$1")" "$2" ;;
              *)        printf '%s/archive/%s.tar.gz\n' "$1" "$2" ;;
            esac
          }

          FWVER=$(dpkg-parsechangelog -l firmware-xiaomi-marble/debian/changelog -SVersion | cut -d- -f1)
          LSVER=$(dpkg-parsechangelog -l libssc/debian/changelog -SVersion | cut -d- -f1)
          IIOVER=$(dpkg-parsechangelog -l iio-sensor-proxy-ssc/debian/changelog -SVersion | cut -d- -f1)

          {
            echo "SRC_FIRMWARE_URL=$(src_url "$SRC_FIRMWARE_REPO" "${SRC_FIRMWARE_REF:-v$FWVER}")"
            echo "SRC_LIBQMI_URL=$(src_url "$SRC_LIBQMI_REPO" "${SRC_LIBQMI_REF:-$(cat libqmi/COMMIT)}")"
            echo "SRC_MODEMMANAGER_URL=$(src_url "$SRC_MODEMMANAGER_REPO" "${SRC_MODEMMANAGER_REF:-$(cat modemmanager/COMMIT)}")"
            echo "SRC_LIBSSC_URL=$(src_url "$SRC_LIBSSC_REPO" "${SRC_LIBSSC_REF:-v$LSVER}")"
            echo "SRC_IIO_URL=$(src_url "$SRC_IIO_REPO" "${SRC_IIO_REF:-$IIOVER}")"
            echo "SRC_HEXAGONRPC_URL=$(src_url "$SRC_HEXAGONRPC_REPO" "${SRC_HEXAGONRPC_REF:-v0.4.0}")"
            echo "SRC_LIBVA_URL=$(src_url "$SRC_LIBVA_REPO" "${SRC_LIBVA_REF:-main}")"
          } >> "$GITHUB_ENV"

          # A wrong parameter shows up as a 404 in the next step, so print what
          # each package is going to be fetched from.
          grep '^SRC_.*_URL=' "$GITHUB_ENV" | sort

      # firmware: overlay debian/ onto the upstream tag snapshot.
      - name: "Build: firmware-xiaomi-marble"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/firmware.tar.gz" "$SRC_FIRMWARE_URL"
          SRC="$RUNNER_TEMP/build/fw/firmware-xiaomi-marble"
          mkdir -p "$SRC"
          tar -xf "$RUNNER_TEMP/build/firmware.tar.gz" -C "$SRC" --strip-components=1
          cp -a firmware-xiaomi-marble/debian "$SRC/debian"
          cd "$SRC"
          dpkg-buildpackage -b -us -uc
          # The .deb lands one level up, in $RUNNER_TEMP/build/fw/, not in build/.
          cp "$SRC"/../*.deb "$GITHUB_WORKSPACE/out/"

      # libqmi: pin 1.39.1 for the QMI_LOC TLVs and ModemManager's >= 1.37.95.
      - name: "Build: libqmi"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libqmi.tar.gz" "$SRC_LIBQMI_URL"
          mkdir -p "$RUNNER_TEMP/build/libqmi"
          tar -xf "$RUNNER_TEMP/build/libqmi.tar.gz" -C "$RUNNER_TEMP/build/libqmi" --strip-components=1
          cp -a libqmi/debian "$RUNNER_TEMP/build/libqmi/debian"
          cd "$RUNNER_TEMP/build/libqmi"
          dpkg-buildpackage -b -us -uc
          dpkg -i "$RUNNER_TEMP/build"/libqmi-glib5_*.deb "$RUNNER_TEMP/build"/libqmi-glib-dev_*.deb \
                  "$RUNNER_TEMP/build"/gir1.2-qmi-1.0_*.deb "$RUNNER_TEMP/build"/libqmi-proxy_*.deb
          cp "$RUNNER_TEMP/build"/libqmi-*.deb "$RUNNER_TEMP/build"/gir1.2-qmi-*.deb "$GITHUB_WORKSPACE/out/" || true

      # marble-device-support: after libqmi, marble-imsctl needs libqmi 1.39.1.
      - name: "Build: marble-device-support"
        run: |
          GIT_TERMINAL_PROMPT=0 timeout 5m git clone --depth 1 --branch "$SRC_DEVSUPPORT_REF" \
            "$SRC_DEVSUPPORT_REPO" "$RUNNER_TEMP/build/marble-device-support"
          cp -a marble-device-support/debian "$RUNNER_TEMP/build/marble-device-support/debian"
          cd "$RUNNER_TEMP/build/marble-device-support"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      - name: "Build: modemmanager"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/mm.tar.gz" "$SRC_MODEMMANAGER_URL"
          mkdir -p "$RUNNER_TEMP/build/mm"
          tar -xf "$RUNNER_TEMP/build/mm.tar.gz" -C "$RUNNER_TEMP/build/mm" --strip-components=1
          cd "$RUNNER_TEMP/build/mm"
          # 3.0 (quilt): dpkg-source applies debian/patches inside dpkg-buildpackage.
          cp -a "$GITHUB_WORKSPACE/modemmanager/debian" debian
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/modemmanager-marble_*.deb "$RUNNER_TEMP/build"/libmm-glib0_*.deb \
             "$RUNNER_TEMP/build"/libmm-glib-dev_*.deb "$RUNNER_TEMP/build"/gir1.2-modemmanager-*.deb \
             "$GITHUB_WORKSPACE/out/"

      - name: "Build: network-manager"
        env:
          DEB_BUILD_PROFILES: nocheck
          SRC_NETWORKMANAGER_REPO: ${{ inputs.networkmanager_src_repo }}
          SRC_NETWORKMANAGER_REF: ${{ inputs.networkmanager_src_ref }}
        run: network-manager/build "$GITHUB_WORKSPACE/out"

      - name: "Build: callaudiod"
        run: |
          mkdir -p "$RUNNER_TEMP/build/callaudiod/src"
          cd "$RUNNER_TEMP/build/callaudiod"
          while read -r digest archive; do
            wget -q -O "$archive" "$SRC_CALLAUDIOD_POOL/$archive"
          done < "$GITHUB_WORKSPACE/callaudiod/SHA256SUMS"
          sha256sum -c "$GITHUB_WORKSPACE/callaudiod/SHA256SUMS"
          tar -xf callaudiod_*.orig.tar.bz2 -C src --strip-components=1
          tar -xf callaudiod_*.debian.tar.xz -C src
          cp -a "$GITHUB_WORKSPACE/callaudiod/debian/." src/debian/
          cd src
          dpkg-buildpackage -B -us -uc
          cp ../callaudiod_*.deb "$GITHUB_WORKSPACE/out/"

      # libssc: overlay debian/ onto the upstream tag snapshot.
      - name: "Build: libssc"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libssc.tar.gz" "$SRC_LIBSSC_URL"
          mkdir -p "$RUNNER_TEMP/build/libssc"
          tar -xf "$RUNNER_TEMP/build/libssc.tar.gz" -C "$RUNNER_TEMP/build/libssc" --strip-components=1

          cp -a libssc/debian "$RUNNER_TEMP/build/libssc/debian"
          cd "$RUNNER_TEMP/build/libssc"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # iio-sensor-proxy needs libssc's headers and pkg-config from the step above.
      - name: "Install libssc (build dependency of iio-sensor-proxy-ssc)"
        run: |
          apt-get install -y "$GITHUB_WORKSPACE"/out/libssc_*.deb

      # iio-sensor-proxy-ssc: upstream 3.9 with SSC support, replaces iio-sensor-proxy.
      - name: "Build: iio-sensor-proxy-ssc"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/iio.tar.gz" "$SRC_IIO_URL"
          mkdir -p "$RUNNER_TEMP/build/iio"
          tar -xf "$RUNNER_TEMP/build/iio.tar.gz" -C "$RUNNER_TEMP/build/iio" --strip-components=1

          cp -a iio-sensor-proxy-ssc/debian "$RUNNER_TEMP/build/iio/debian"
          cd "$RUNNER_TEMP/build/iio"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # Build the daemon that serves the precompiled Marble sensor registry.
      - name: "Build: hexagonrpc"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/hexagonrpc.tar.gz" "$SRC_HEXAGONRPC_URL"
          mkdir -p "$RUNNER_TEMP/build/hexagonrpc"
          tar -xf "$RUNNER_TEMP/build/hexagonrpc.tar.gz" -C "$RUNNER_TEMP/build/hexagonrpc" --strip-components=1
          cp -a "$GITHUB_WORKSPACE/hexagonrpc/debian" "$RUNNER_TEMP/build/hexagonrpc/debian"
          cd "$RUNNER_TEMP/build/hexagonrpc"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/hexagonrpcd_*.deb \
             "$RUNNER_TEMP/build"/libhexagonrpc0.4_*.deb \
             "$GITHUB_WORKSPACE/out/"

      # libva-v4l2-iris: Iris VA-API backend from the FFT-infra fork. Keep
      # upstream's debian/ and package name; its install helper already
      # provides the msm_drv_video.so alias.
      - name: "Build: libva-v4l2-iris"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libva-v4l2.tar.gz" "$SRC_LIBVA_URL"
          mkdir -p "$RUNNER_TEMP/build/libva-v4l2"
          tar -xf "$RUNNER_TEMP/build/libva-v4l2.tar.gz" -C "$RUNNER_TEMP/build/libva-v4l2" --strip-components=1
          cd "$RUNNER_TEMP/build/libva-v4l2"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/libva-v4l2-iris_*.deb "$GITHUB_WORKSPACE/out/"

      - name: Upload DEBs
        uses: actions/upload-artifact@v7
        with:
          name: marble-debs
          path: out/**/*.deb
          retention-days: 14
          if-no-files-found: error

      # Cacheable calls: 0 means meson never wrapped the compiler; the cache is idle.
      - name: ccache stats
        if: always()
        run: |
          echo "CCACHE_DIR=${CCACHE_DIR:-unset}  CCACHE_MAXSIZE=${CCACHE_MAXSIZE:-unset}"
          ccache --show-stats -v || true

      # Cache this run's output even when a step above failed.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

  # GitHub Release
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Download DEBs
        uses: actions/download-artifact@v8
        with:
          name: marble-debs
          path: debs

      # dbgsym debs stay in the build artifact, never in the release.
      - name: Stage release DEBs (drop dbgsym)
        run: |
          rm -rf release-debs && mkdir -p release-debs
          find debs -name '*.deb' ! -name '*-dbgsym*.deb' -exec cp -t release-debs {} +

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: marble-deb-${{ env.SHORT_SHA }}
          name: Marble Deb Packages (${{ env.SHORT_SHA }})
          files: release-debs/**/*.deb
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
