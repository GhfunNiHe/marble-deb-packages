name: Build Marble Deb Packages

# Each package dir is overlaid onto a fresh upstream checkout; the kernel builds in build-kernel.yml.

# Source parameters: overridable per run via workflow_dispatch. Empty refs
# fall back to the changelog version or <pkg>/COMMIT; keep them in sync.
env:
  SRC_FIRMWARE_REPO: ${{ inputs.firmware_src_repo || 'https://github.com/iLtanaka/firmware-xiaomi-marble' }}
  SRC_FIRMWARE_REF: ${{ inputs.firmware_src_ref }}          # empty = v<changelog version>
  SRC_LIBQMI_REPO: ${{ inputs.libqmi_src_repo || 'https://gitlab.freedesktop.org/mobile-broadband/libqmi' }}
  SRC_LIBQMI_REF: ${{ inputs.libqmi_src_ref }}              # empty = libqmi/COMMIT
  SRC_LIBMBIM_REPO: ${{ inputs.libmbim_src_repo || 'https://gitlab.freedesktop.org/mobile-broadband/libmbim' }}
  SRC_LIBMBIM_REF: ${{ inputs.libmbim_src_ref || '1.32.0' }} # Ubuntu 24.04 backport floor
  SRC_DEVSUPPORT_REPO: ${{ inputs.devsupport_src_repo || 'https://github.com/GhfunNiHe/marble-device-support' }}
  SRC_DEVSUPPORT_REF: ${{ inputs.devsupport_src_ref }}      # empty = upstream default branch
  SRC_MODEMMANAGER_REPO: ${{ inputs.modemmanager_src_repo || 'https://gitlab.freedesktop.org/mobile-broadband/ModemManager' }}
  SRC_MODEMMANAGER_REF: ${{ inputs.modemmanager_src_ref }}  # empty = modemmanager/COMMIT
  SRC_LIBSSC_REPO: ${{ inputs.libssc_src_repo || 'https://codeberg.org/DylanVanAssche/libssc' }}
  SRC_LIBSSC_REF: ${{ inputs.libssc_src_ref }}              # empty = v<changelog version>
  SRC_IIO_REPO: ${{ inputs.iio_src_repo || 'https://gitlab.freedesktop.org/hadess/iio-sensor-proxy' }}
  SRC_IIO_REF: ${{ inputs.iio_src_ref }}                    # empty = <changelog version>
  SRC_HEXAGONRPC_REPO: ${{ inputs.hexagonrpc_src_repo || 'https://github.com/linux-msm/hexagonrpc' }}
  SRC_HEXAGONRPC_REF: ${{ inputs.hexagonrpc_src_ref || 'v0.4.0' }} # Sensor registry support
  SRC_LIBVA_REPO: ${{ inputs.libva_src_repo || 'https://github.com/FFT-infra/qualcomm-iris-vaapi' }}
  SRC_LIBVA_REF: ${{ inputs.libva_src_ref || 'feat/encode-entrypoints' }}  # empty = feat/encode-entrypoints
  SRC_KERNEL_REPO: ${{ inputs.kernel_src_repo || 'https://github.com/GhfunNiHe/linux-marble' }}
  SRC_KERNEL_REF: ${{ inputs.kernel_src_ref }}              # empty = marble-7.2

on:
  push:
    branches:
      - main
    paths:
      - 'linux-xiaomi-marble/**'
      - 'marble-device-support/**'
      - 'firmware-xiaomi-marble/**'
      - 'libssc/**'
      - 'libqmi/**'
      - 'libmbim/**'
      - 'modemmanager/**'
      - 'iio-sensor-proxy-ssc/**'
      - 'hexagonrpc/**'
      - 'libva-v4l2/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      # 版本号与 debian/changelog、<pkg>/COMMIT 手动保持一致（default 不支持表达式）。
      firmware_src_repo:
        description: 'firmware-xiaomi-marble 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/iLtanaka/firmware-xiaomi-marble'
      firmware_src_ref:
        description: 'firmware-xiaomi-marble 的 tag/分支/提交（留空 = v<debian/changelog 版本>）'
        type: string
        default: ''
      libqmi_src_repo:
        description: 'libqmi 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/mobile-broadband/libqmi'
      libqmi_src_ref:
        description: 'libqmi 的 tag/分支/提交（留空 = libqmi/COMMIT）'
        type: string
        default: ''
      libmbim_src_repo:
        description: 'libmbim 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/mobile-broadband/libmbim'
      libmbim_src_ref:
        description: 'libmbim 的 tag/分支/提交（Ubuntu 24.04 回移植基线）'
        type: string
        default: '1.32.0'
      devsupport_src_repo:
        description: 'marble-device-support 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/GhfunNiHe/marble-device-support'
      devsupport_src_ref:
        description: 'marble-device-support 的分支/tag（留空 = 上游默认分支）'
        type: string
        default: ''
      modemmanager_src_repo:
        description: 'ModemManager 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/mobile-broadband/ModemManager'
      modemmanager_src_ref:
        description: 'ModemManager 的 tag/分支/提交（留空 = modemmanager/COMMIT）'
        type: string
        default: ''
      libssc_src_repo:
        description: 'libssc 源码仓库地址 (repo URL)'
        type: string
        default: 'https://codeberg.org/DylanVanAssche/libssc'
      libssc_src_ref:
        description: 'libssc 的 tag/分支/提交（留空 = v<debian/changelog 版本>）'
        type: string
        default: ''
      iio_src_repo:
        description: 'iio-sensor-proxy 源码仓库地址 (repo URL)'
        type: string
        default: 'https://gitlab.freedesktop.org/hadess/iio-sensor-proxy'
      iio_src_ref:
        description: 'iio-sensor-proxy 的 tag/分支/提交（留空 = <debian/changelog 版本>）'
        type: string
        default: ''
      hexagonrpc_src_repo:
        description: 'hexagonrpc 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/linux-msm/hexagonrpc'
      hexagonrpc_src_ref:
        description: 'hexagonrpc 的 tag/分支/提交（Noble 回移植默认 v0.4.0）'
        type: string
        default: 'v0.4.0'
      libva_src_repo:
        description: 'libva-v4l2 源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/FFT-infra/qualcomm-iris-vaapi'
      libva_src_ref:
        description: 'libva-v4l2 的 tag/分支/提交'
        type: string
        default: 'feat/encode-entrypoints'
      kernel_src_repo:
        description: 'linux-marble 内核源码仓库地址 (repo URL)'
        type: string
        default: 'https://github.com/GhfunNiHe/linux-marble'
      kernel_src_ref:
        description: 'linux-marble 的分支/tag/提交'
        type: string
        default: 'marble-7.2'

# Rebuilds supersede each other; never queue them up.
concurrency:
  group: build-marble-debs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DEBs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    container:
      image: ubuntu:24.04
    env:
      # 4G each: one kernel cache would otherwise evict everything.
      CCACHE_MAXSIZE: 4G

    steps:
      # Union of the packages' Build-Depends; libqmi-glib-dev and meson come from the next step.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev ccache git ca-certificates wget \
            bc bison flex libssl-dev libelf-dev dwarves \
            rsync cpio kmod python3 zstd xz-utils lz4 alsa-utils \
            clang lld llvm \
            ninja-build pkg-config file patch \
            libglib2.0-dev libprotobuf-c-dev \
            protobuf-compiler protobuf-c-compiler \
            libgudev-1.0-dev libpolkit-gobject-1-dev \
            libmbim-glib-dev libqrtr-glib-dev libsystemd-dev libgirepository1.0-dev \
            gtk-doc-tools gi-docgen help2man valac xsltproc systemd-dev \
            bash-completion gettext libdbus-1-dev dbus polkitd \
            python3-dbus python3-dev python3-gi libglib2.0-doc \
            libva-dev libdrm-dev libegl-dev libgles-dev libgbm-dev

      # noble has meson 1.3.2, libssc needs >= 1.4.0: build 1.4.2 as a dpkg-registered package.
      - name: Bootstrap meson 1.4.2 (noble has 1.3.2)
        run: |
          if command -v meson >/dev/null 2>&1 \
             && dpkg --compare-versions "$(meson --version)" ge 1.4.0; then
            echo "meson $(meson --version) already satisfies libssc"
            exit 0
          fi

          MESON_VERSION=1.4.2
          rm -rf /tmp/meson-build /tmp/meson-pkg
          mkdir -p /tmp/meson-build /tmp/meson-pkg/DEBIAN \
                   /tmp/meson-pkg/usr/bin \
                   /tmp/meson-pkg/usr/lib/python3/dist-packages
          wget -q -O /tmp/meson.tar.gz \
            "https://github.com/mesonbuild/meson/archive/refs/tags/${MESON_VERSION}.tar.gz"
          tar -xf /tmp/meson.tar.gz -C /tmp/meson-build --strip-components=1

          install -m 755 /tmp/meson-build/meson.py /tmp/meson-pkg/usr/bin/meson
          cp -a /tmp/meson-build/mesonbuild \
            /tmp/meson-pkg/usr/lib/python3/dist-packages/
          printf '%s\n' \
            'Package: meson' \
            'Version: 1.4.2-0marble1' \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: all' \
            'Depends: python3, ninja-build' \
            'Maintainer: GhfunNiHe <131235947+GhfunNiHe@users.noreply.github.com>' \
            'Description: high productivity build system (Ubuntu 24.04 backport)' \
            > /tmp/meson-pkg/DEBIAN/control
          dpkg-deb --build /tmp/meson-pkg /tmp/meson_1.4.2-0marble1_all.deb
          dpkg -i /tmp/meson_1.4.2-0marble1_all.deb
          meson --version | grep -qx "$MESON_VERSION" \
            || { echo "FAIL: meson $MESON_VERSION was not installed"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup work dirs
        run: |
          mkdir -p "$RUNNER_TEMP/build" "$GITHUB_WORKSPACE/out"
          # One ccache dir for the whole job, the same default debian/rules uses.
          mkdir -p "$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          # meson no longer auto-detects ccache; Debian's /usr/lib/ccache shim
          # wraps whatever compiler each package invokes.
          if [ -d /usr/lib/ccache ]; then
            echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
            ls /usr/lib/ccache
          else
            echo "::warning::/usr/lib/ccache is missing; the meson packages will compile uncached"
          fi

      # Separate always-on save: save-always is deprecated, keys carry run_id.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-marble-${{ runner.os }}-${{ runner.arch }}-
            ccache-marble-

      # One SRC_<PKG>_URL per package; build steps below never spell a URL out.
      - name: Resolve source URLs
        run: |
          # GitLab needs the project name in the path; others do not.
          src_url() {   # $1 = repo URL, $2 = ref
            case "$1" in
              *gitlab*) printf '%s/-/archive/%s/%s-%s.tar.gz\n' "$1" "$2" "$(basename "$1")" "$2" ;;
              *)        printf '%s/archive/%s.tar.gz\n' "$1" "$2" ;;
            esac
          }

          FWVER=$(dpkg-parsechangelog -l firmware-xiaomi-marble/debian/changelog -SVersion | cut -d- -f1)
          LSVER=$(dpkg-parsechangelog -l libssc/debian/changelog -SVersion | cut -d- -f1)
          IIOVER=$(dpkg-parsechangelog -l iio-sensor-proxy-ssc/debian/changelog -SVersion | cut -d- -f1)

          {
            echo "SRC_FIRMWARE_URL=$(src_url "$SRC_FIRMWARE_REPO" "${SRC_FIRMWARE_REF:-v$FWVER}")"
            echo "SRC_LIBQMI_URL=$(src_url "$SRC_LIBQMI_REPO" "${SRC_LIBQMI_REF:-$(cat libqmi/COMMIT)}")"
            echo "SRC_LIBMBIM_URL=$(src_url "$SRC_LIBMBIM_REPO" "${SRC_LIBMBIM_REF:-1.32.0}")"
            echo "SRC_MODEMMANAGER_URL=$(src_url "$SRC_MODEMMANAGER_REPO" "${SRC_MODEMMANAGER_REF:-$(cat modemmanager/COMMIT)}")"
            echo "SRC_LIBSSC_URL=$(src_url "$SRC_LIBSSC_REPO" "${SRC_LIBSSC_REF:-v$LSVER}")"
            echo "SRC_IIO_URL=$(src_url "$SRC_IIO_REPO" "${SRC_IIO_REF:-$IIOVER}")"
            echo "SRC_HEXAGONRPC_URL=$(src_url "$SRC_HEXAGONRPC_REPO" "${SRC_HEXAGONRPC_REF:-v0.4.0}")"
            echo "SRC_LIBVA_URL=$(src_url "$SRC_LIBVA_REPO" "${SRC_LIBVA_REF:-feat/encode-entrypoints}")"
            echo "SRC_KERNEL_URL=$(src_url "$SRC_KERNEL_REPO" "${SRC_KERNEL_REF:-marble-7.2}")"
          } >> "$GITHUB_ENV"

          # A wrong parameter shows up as a 404 in the next step, so print what
          # each package is going to be fetched from.
          grep '^SRC_.*_URL=' "$GITHUB_ENV" | sort

      # firmware: overlay debian/ onto the upstream tag snapshot.
      - name: "Build: firmware-xiaomi-marble"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/firmware.tar.gz" "$SRC_FIRMWARE_URL"
          mkdir -p "$RUNNER_TEMP/build/fw"
          tar -xf "$RUNNER_TEMP/build/firmware.tar.gz" -C "$RUNNER_TEMP/build/fw"
          SRC=$(find "$RUNNER_TEMP/build/fw" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$SRC" ] || { echo "FAIL: firmware tarball has no top-level directory"; exit 1; }

          cp -a firmware-xiaomi-marble/debian "$SRC/debian"
          cd "$SRC"
          dpkg-buildpackage -b -us -uc
          # The .deb lands one level up, in $RUNNER_TEMP/build/fw/, not in build/.
          cp "$SRC"/../*.deb "$GITHUB_WORKSPACE/out/"

      # libmbim: backport 1.32.0, noble ships 1.31.2.
      - name: "Build: libmbim"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libmbim.tar.gz" "$SRC_LIBMBIM_URL"
          mkdir -p "$RUNNER_TEMP/build/libmbim"
          tar -xf "$RUNNER_TEMP/build/libmbim.tar.gz" -C "$RUNNER_TEMP/build/libmbim" --strip-components=1
          cp -a libmbim/debian "$RUNNER_TEMP/build/libmbim/debian"
          cd "$RUNNER_TEMP/build/libmbim"
          dpkg-buildpackage -b -us -uc
          dpkg -i "$RUNNER_TEMP/build"/libmbim-glib4_*.deb "$RUNNER_TEMP/build"/libmbim-glib-dev_*.deb \
                  "$RUNNER_TEMP/build"/libmbim-utils_*.deb "$RUNNER_TEMP/build"/libmbim-proxy_*.deb
          cp "$RUNNER_TEMP/build"/libmbim-*.deb "$GITHUB_WORKSPACE/out/"

      # libqmi: pin 1.39.1 for the QMI_LOC TLVs and ModemManager's >= 1.37.95.
      - name: "Build: libqmi"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libqmi.tar.gz" "$SRC_LIBQMI_URL"
          mkdir -p "$RUNNER_TEMP/build/libqmi"
          tar -xf "$RUNNER_TEMP/build/libqmi.tar.gz" -C "$RUNNER_TEMP/build/libqmi" --strip-components=1
          cp -a libqmi/debian "$RUNNER_TEMP/build/libqmi/debian"
          cd "$RUNNER_TEMP/build/libqmi"
          dpkg-buildpackage -b -us -uc
          dpkg -i "$RUNNER_TEMP/build"/libqmi-glib5_*.deb "$RUNNER_TEMP/build"/libqmi-glib-dev_*.deb \
                  "$RUNNER_TEMP/build"/gir1.2-qmi-1.0_*.deb "$RUNNER_TEMP/build"/libqmi-proxy_*.deb
          cp "$RUNNER_TEMP/build"/libqmi-*.deb "$RUNNER_TEMP/build"/gir1.2-qmi-*.deb "$GITHUB_WORKSPACE/out/" || true

      # marble-device-support: after libqmi, marble-imsctl needs libqmi 1.39.1.
      - name: "Build: marble-device-support"
        run: |
          # Empty ref follows upstream's default branch.
          if [ -n "$SRC_DEVSUPPORT_REF" ]; then
            git clone --depth 1 --branch "$SRC_DEVSUPPORT_REF" \
              "$SRC_DEVSUPPORT_REPO" "$RUNNER_TEMP/build/marble-device-support"
          else
            git clone --depth 1 "$SRC_DEVSUPPORT_REPO" \
              "$RUNNER_TEMP/build/marble-device-support"
          fi
          cp -a marble-device-support/debian "$RUNNER_TEMP/build/marble-device-support/debian"
          cd "$RUNNER_TEMP/build/marble-device-support"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # modemmanager: master, pinned to the AFW-unlock / Position-Report commits.
      - name: "Build: modemmanager"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/mm.tar.gz" "$SRC_MODEMMANAGER_URL"
          mkdir -p "$RUNNER_TEMP/build/mm"
          tar -xf "$RUNNER_TEMP/build/mm.tar.gz" -C "$RUNNER_TEMP/build/mm" --strip-components=1
          cd "$RUNNER_TEMP/build/mm"
          # 3.0 (quilt): dpkg-source applies debian/patches inside dpkg-buildpackage.
          cp -a "$GITHUB_WORKSPACE/modemmanager/debian" debian
          DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/modemmanager-marble_*.deb "$RUNNER_TEMP/build"/libmm-glib0_*.deb \
             "$RUNNER_TEMP/build"/libmm-glib-dev_*.deb "$RUNNER_TEMP/build"/gir1.2-modemmanager-*.deb \
             "$GITHUB_WORKSPACE/out/"

      # libssc: overlay debian/ onto the upstream tag snapshot.
      - name: "Build: libssc"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libssc.tar.gz" "$SRC_LIBSSC_URL"
          mkdir -p "$RUNNER_TEMP/build/libssc"
          tar -xf "$RUNNER_TEMP/build/libssc.tar.gz" -C "$RUNNER_TEMP/build/libssc" --strip-components=1

          cp -a libssc/debian "$RUNNER_TEMP/build/libssc/debian"
          cd "$RUNNER_TEMP/build/libssc"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # iio-sensor-proxy needs libssc's headers and pkg-config from the step above.
      - name: "Install libssc (build dependency of iio-sensor-proxy-ssc)"
        run: |
          apt-get install -y "$GITHUB_WORKSPACE"/out/libssc_*.deb
          pkg-config --modversion libssc

      # iio-sensor-proxy-ssc: upstream 3.9 with SSC support, replaces iio-sensor-proxy.
      - name: "Build: iio-sensor-proxy-ssc"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/iio.tar.gz" "$SRC_IIO_URL"
          mkdir -p "$RUNNER_TEMP/build/iio"
          tar -xf "$RUNNER_TEMP/build/iio.tar.gz" -C "$RUNNER_TEMP/build/iio" --strip-components=1

          cp -a iio-sensor-proxy-ssc/debian "$RUNNER_TEMP/build/iio/debian"
          cd "$RUNNER_TEMP/build/iio"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/*.deb "$GITHUB_WORKSPACE/out/"

      # Build the daemon that serves the precompiled Marble sensor registry.
      - name: "Build: hexagonrpc"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/hexagonrpc.tar.gz" "$SRC_HEXAGONRPC_URL"
          mkdir -p "$RUNNER_TEMP/build/hexagonrpc"
          tar -xf "$RUNNER_TEMP/build/hexagonrpc.tar.gz" -C "$RUNNER_TEMP/build/hexagonrpc" --strip-components=1
          cp -a "$GITHUB_WORKSPACE/hexagonrpc/debian" "$RUNNER_TEMP/build/hexagonrpc/debian"
          cd "$RUNNER_TEMP/build/hexagonrpc"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/hexagonrpcd_*.deb \
             "$RUNNER_TEMP/build"/libhexagonrpc0.4_*.deb \
             "$GITHUB_WORKSPACE/out/"

      # libva-v4l2: Iris VA-API backend from the FFT-infra fork.
      - name: "Build: libva-v4l2"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/libva-v4l2.tar.gz" "$SRC_LIBVA_URL"
          mkdir -p "$RUNNER_TEMP/build/libva-v4l2"
          tar -xf "$RUNNER_TEMP/build/libva-v4l2.tar.gz" -C "$RUNNER_TEMP/build/libva-v4l2" --strip-components=1
          cp -a "$GITHUB_WORKSPACE/libva-v4l2/debian" "$RUNNER_TEMP/build/libva-v4l2/debian"
          cd "$RUNNER_TEMP/build/libva-v4l2"
          dpkg-buildpackage -b -us -uc
          cp "$RUNNER_TEMP/build"/libva-v4l2_*.deb "$GITHUB_WORKSPACE/out/"

      # Kernel: overlay debian/ + configs onto the upstream main snapshot
      - name: "Build: linux-xiaomi-marble"
        run: |
          wget -c -q -O "$RUNNER_TEMP/build/linux-marble.tar.gz" "$SRC_KERNEL_URL"
          # Top-level dir is <repo>-<ref>: find it instead of assuming a name.
          mkdir -p "$RUNNER_TEMP/build/kernel-src"
          tar -xf "$RUNNER_TEMP/build/linux-marble.tar.gz" -C "$RUNNER_TEMP/build/kernel-src"
          SRC=$(find "$RUNNER_TEMP/build/kernel-src" -mindepth 1 -maxdepth 1 -type d | head -1)
          [ -n "$SRC" ] || { echo "FAIL: kernel tarball has no top-level directory"; exit 1; }
          cp -a linux-xiaomi-marble/debian "$SRC/debian"
          cp linux-xiaomi-marble/config-xiaomi-marble.aarch64 "$SRC/"
          cp linux-xiaomi-marble/extra-kernel.config "$SRC/"

          cd "$SRC"
          # The tree carries our patches; debian/rules only syncs and merges the config.
          dpkg-buildpackage -b -us -uc
          echo "=== ccache stats ==="
          ccache --show-stats

          KREL=$(cat include/config/kernel.release)
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          # The .deb lands in the wrapper dir, not in $RUNNER_TEMP/build.
          cp "$SRC"/../*.deb "$GITHUB_WORKSPACE/out/"
          {
            echo "### Kernel build result"
            echo ""
            echo "- kernel release: \`${KREL}\`"
            echo "- modules: $(find "$GITHUB_WORKSPACE/out" -name '*.deb' -exec dpkg-deb -c {} \; | grep -c 'ko\.zst')"
          } >> "$GITHUB_STEP_SUMMARY"

      # Assert on the DEB: two boot files, vmlinuz uncompressed.
      - name: Verify kernel DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/linux-xiaomi-marble_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no kernel deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          # [^/][^/]* skips dpkg-deb's bare ./boot/ entry; sh -e (dash), no process substitution.
          BOOT=$(dpkg-deb -c "$DEB" | awk '{print $6}' | grep '^\./boot/[^/][^/]*$' | sort)
          EXPECT=$(printf './boot/sm8475-xiaomi-marble-%s.dtb\n./boot/vmlinuz-%s\n' "$KREL" "$KREL")
          if [ "$BOOT" != "$EXPECT" ]; then
            echo "FAIL: /boot contents are not vmlinuz + DTB only"
            printf 'actual:\n%s\nexpected:\n%s\n' "$BOOT" "$EXPECT"
            exit 1
          fi

          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify"
          if ! file "$RUNNER_TEMP/verify/boot/vmlinuz-$KREL" | grep -q 'ARM64 boot executable Image'; then
            echo "FAIL: vmlinuz is not an uncompressed arm64 Image"; exit 1
          fi
          # ath11k is a module: assert on the firmware name the MAC patch adds.
          MOD=$(find "$RUNNER_TEMP/verify" -name 'ath11k.ko.zst' | head -1)
          [ -n "$MOD" ] || { echo "FAIL: ath11k.ko.zst not found in the kernel deb"; exit 1; }
          zstdcat "$MOD" | strings | grep -q 'wlan_mac.bin' \
            || { echo "FAIL: ath11k WLAN MAC patch is not in the built module"; exit 1; }

          # iris decode-order: assert on the static handler in the module's kallsyms.
          IRIS=$(find "$RUNNER_TEMP/verify" -name 'qcom-iris.ko.zst' | head -1)
          [ -n "$IRIS" ] || { echo "FAIL: qcom-iris.ko.zst not found in the kernel deb"; exit 1; }
          zstdcat "$IRIS" | strings | grep -q 'iris_hfi_gen2_set_decode_order_output' \
            || { echo "FAIL: iris decode-order patch is not in the built module"; exit 1; }
          echo "kernel deb verified: $DEB"

      # firmware: assert on the Bluetooth link btqca opens (shipped wrong once).
      - name: Verify firmware DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/firmware-xiaomi-marble_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no firmware deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Recommends

          LIST=$(dpkg-deb -c "$DEB")
          for f in \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/a730_zap.mbn \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/adsp2.b00 \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/modem.mdt \
            ./usr/lib/firmware/qcom/sm8475/xiaomi/marble/slpi2.b00 \
            ./usr/lib/firmware/qcom/a730_sqe.fw \
            ./usr/lib/firmware/qcom/gmu_gen70000.bin \
            ./usr/lib/firmware/qcom/sm8450/SM8475-Xiaomi-Marble-tplg.bin \
            ./usr/lib/firmware/qca/hpbtfw21.tlv \
            ./usr/lib/firmware/ath11k/WCN6855/hw2.0/board.bin \
            ./usr/share/qcom/hexagonfs/sns_reg_version ; do
            echo "$LIST" | grep -q " $f\$" || { echo "FAIL: firmware deb is missing $f"; exit 1; }
          done

          echo "$LIST" | grep -qE 'qca/wcnhpbtfw21\.tlv -> hpbtfw21\.tlv$' \
            || { echo "FAIL: qca/wcnhpbtfw21.tlv link missing or points at the wrong name"; exit 1; }
          echo "$LIST" | grep -qE 'qca/wcnhpnv21\.301 -> hpnv21\.301$' \
            || { echo "FAIL: qca/wcnhpnv21.301 link missing or points at the wrong name"; exit 1; }

          echo "wcn-prefixed links: $(echo "$LIST" | grep -c 'wcnh')"
          echo "firmware deb verified: $DEB"

          # The generated ALSA graph must contain all three board backends;
          # file existence alone also passes for the old speaker-only graph.
          dpkg-deb --fsys-tarfile "$DEB" | tar -xOf - \
            ./usr/lib/firmware/qcom/sm8450/SM8475-Xiaomi-Marble-tplg.bin \
            > "$RUNNER_TEMP/marble-audio-topology.bin"
          alsatplg -d "$RUNNER_TEMP/marble-audio-topology.bin" \
            -o "$RUNNER_TEMP/marble-audio-topology.conf"
          for backend in RX_CODEC_DMA_RX_0 TERTIARY_TDM_RX_0 TX_CODEC_DMA_TX_3; do
            grep -q "$backend" "$RUNNER_TEMP/marble-audio-topology.conf" \
              || { echo "FAIL: missing audio backend $backend"; exit 1; }
          done

      - name: Verify wired audio UCM
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/marble-device-support_*.deb | head -1)
          dpkg-deb --fsys-tarfile "$DEB" | tar -xOf - \
            ./usr/share/alsa/ucm2/Qualcomm/sm8450/xiaomi-marble/HiFi.conf \
            > "$RUNNER_TEMP/marble-HiFi.conf"
          grep -Fq 'SectionDevice."Headphones"' "$RUNNER_TEMP/marble-HiFi.conf"
          grep -Fq 'SectionDevice."Headset"' "$RUNNER_TEMP/marble-HiFi.conf"
          grep -Fq "RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2" "$RUNNER_TEMP/marble-HiFi.conf"

      # libssc is a build dependency: headers and pkg-config are the interface.
      - name: Verify libssc DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/libssc_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no libssc deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends

          LIST=$(dpkg-deb -c "$DEB")
          for pat in 'libssc\.so\.2' '/ssccli$' 'pkgconfig/libssc\.pc$' 'include/libssc/libssc-sensor\.h$'; do
            echo "$LIST" | grep -qE "$pat" || { echo "FAIL: libssc deb is missing $pat"; exit 1; }
          done

          rm -rf "$RUNNER_TEMP/verify-libssc"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify-libssc"
          SO=$(find "$RUNNER_TEMP/verify-libssc" -name 'libssc.so.2*' -type f | head -1)
          [ -n "$SO" ] || { echo "FAIL: no libssc.so.2 in the package"; exit 1; }
          echo "shared library: $SO"
          strings "$SO" > "$RUNNER_TEMP/libssc.strings"
          for signal in node-added service-added; do
            grep -Fxq "$signal" "$RUNNER_TEMP/libssc.strings" \
              || { echo "FAIL: libssc is missing the QRTR $signal subscription"; exit 1; }
          done
          if nm -D --undefined-only "$SO" | grep -E '[[:space:]]sleep(@|$)' >/dev/null; then
            echo "FAIL: libssc still imports sleep for the QRTR retry"
            exit 1
          fi
          echo "libssc deb verified: $DEB"

      # Must still link libssc, or -Dssc-support fell back to disabled.
      - name: Verify iio-sensor-proxy-ssc DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/iio-sensor-proxy-ssc_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no iio-sensor-proxy-ssc deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends Provides Conflicts Replaces

          dpkg-deb -x "$DEB" "$RUNNER_TEMP/verify-iio"
          readelf -d "$RUNNER_TEMP/verify-iio/usr/libexec/iio-sensor-proxy" | grep -F '[libssc.so.2]' \
            || { echo "FAIL: proxy binary does not link libssc"; exit 1; }
          dpkg-deb -f "$DEB" Provides | grep -q 'iio-sensor-proxy' \
            || { echo "FAIL: missing Provides: iio-sensor-proxy"; exit 1; }

          LIST=$(dpkg-deb -c "$DEB")
          # Path prefixes vary (/usr/lib or /lib); the file names must not.
          for pat in '/usr/libexec/iio-sensor-proxy$' '/monitor-sensor$' \
                     '/systemd/system/iio-sensor-proxy\.service$' \
                     '/udev/rules\.d/80-iio-sensor-proxy\.rules$' \
                     '/dbus-1/system\.d/net\.hadess\.SensorProxy\.conf$' \
                     '/polkit-1/actions/net\.hadess\.SensorProxy\.policy$'; do
            echo "$LIST" | grep -qE "$pat" || { echo "FAIL: missing $pat"; exit 1; }
          done
          echo "iio-sensor-proxy-ssc deb verified: $DEB"

      # libva must find the driver in the multiarch dri dir with the msm alias.
      - name: Verify libva-v4l2 DEB
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/out/libva-v4l2_*.deb | head -1)
          [ -n "$DEB" ] || { echo "FAIL: no libva-v4l2 deb built"; exit 1; }
          dpkg-deb -f "$DEB" Package Version Architecture Depends Provides

          dpkg-deb -f "$DEB" Provides | grep -q 'va-driver' \
            || { echo "FAIL: missing Provides: va-driver"; exit 1; }
          dpkg-deb -f "$DEB" Depends | grep -q 'libdrm' \
            || { echo "FAIL: no libdrm dependency -> the driver links nothing"; exit 1; }

          LIST=$(dpkg-deb -c "$DEB")
          echo "$LIST" | grep -qE 'dri/v4l2_drv_video\.so$' \
            || { echo "FAIL: v4l2_drv_video.so is not installed under .../dri"; exit 1; }
          echo "$LIST" | grep -qE 'dri/msm_drv_video\.so -> v4l2_drv_video\.so$' \
            || { echo "FAIL: the msm_drv_video.so alias is missing or points elsewhere"; exit 1; }
          echo "$LIST" | grep -qE 'environment\.d/60-libva-v4l2\.conf$' \
            || { echo "FAIL: GStreamer VA environment config is missing"; exit 1; }
          # The branch installs no launcher, only the diagnostic trio and the node helper.
          for f in 'bin/iris-device-check\.sh' 'bin/iris-verify\.sh' \
                   'bin/iris-configure-clients\.sh' \
                   'share/iris-vaapi/iris-node\.sh'; do
            echo "$LIST" | grep -qE "$f$" \
              || { echo "FAIL: upstream file $f is missing"; exit 1; }
          done
          echo "libva-v4l2 deb verified: $DEB"

      # A partial success is not a release. These are the packages every rootfs
      # installation requires; the install tests also re-check them per distro.
      - name: Verify required release package set
        run: |
          missing=0
          for p in \
            linux-xiaomi-marble \
            firmware-xiaomi-marble \
            marble-device-support \
            modemmanager-marble \
            libmm-glib0 \
            libqmi-glib5 \
            libqmi-proxy \
            libmbim-glib4 \
            libmbim-proxy \
            libssc \
            iio-sensor-proxy-ssc \
            hexagonrpcd \
            libhexagonrpc0.4 \
            libva-v4l2; do
            found=
            for deb in out/${p}_*.deb; do
              if [ -e "$deb" ]; then
                found=1
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "FAIL: required package was not built: $p"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          for deb in out/*.deb; do
            dpkg-deb --info "$deb" >/dev/null \
              || { echo "FAIL: unreadable DEB: $deb"; exit 1; }
          done

          dpkg-deb -f out/libmbim-glib4_*.deb Package Version Architecture Depends
          echo "required release package set present"

      - name: Upload DEBs
        uses: actions/upload-artifact@v7
        with:
          name: marble-debs
          path: out/**/*.deb
          retention-days: 14
          if-no-files-found: error

      # Cacheable calls: 0 means meson never wrapped the compiler; the cache is idle.
      - name: ccache stats
        if: always()
        run: |
          echo "CCACHE_DIR=${CCACHE_DIR:-unset}  CCACHE_MAXSIZE=${CCACHE_MAXSIZE:-unset}"
          ccache --show-stats -v || true

      # Cache this run's output even when a step above failed.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-marble-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

  # GitHub Release
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get short commit SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Download DEBs
        uses: actions/download-artifact@v8
        with:
          name: marble-debs
          path: debs

      # dbgsym debs stay in the build artifact, never in the release.
      - name: Stage release DEBs (drop dbgsym)
        run: |
          rm -rf release-debs && mkdir -p release-debs
          find debs -name '*.deb' ! -name '*-dbgsym*.deb' -exec cp -t release-debs {} +

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: marble-deb-${{ env.SHORT_SHA }}
          name: Marble Deb Packages (${{ env.SHORT_SHA }})
          files: release-debs/**/*.deb
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
