        ]
}

SectionWidget."RX_CODEC_DMA_RX_0 Audio Mixer" {
    	reg "-1"
        index "113"
        type "mixer"

        mixer [

		MultiMedia2
		MultiMedia1
        ]

	data [
                "device113.sub_graph1_data"
	]
}
# The installed frontend graph ends at mfc1; it has no logger widget.

SectionGraph."RX_CODEC_DMA_RX_0 Audio Mixer Graph" {
        index "113"
        lines [

		"RX_CODEC_DMA_RX_0 Audio Mixer, MultiMedia2, stream1.mfc1"
		"RX_CODEC_DMA_RX_0 Audio Mixer, MultiMedia1, stream0.mfc1"
        ]
